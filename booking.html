
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPL Ticket Booking</title>
    <link rel="stylesheet" href="styles.css">

    <style>
        .booking-page {
            max-width: 650px;
            margin: 110px auto 40px;
            padding: 30px;
            background: #fff;
            color: #222;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        .booking-page h1 {
            text-align: center;
            color: #102b55;
            margin-bottom: 25px;
        }

        .booking-page label {
            display: block;
            margin: 14px 0 7px;
            font-weight: bold;
        }

        .booking-page input,
        .booking-page select {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }

        .booking-page .preference input {
            width: auto;
        }

        .booking-page .preference label {
            display: inline-block;
            margin-right: 18px;
            font-weight: normal;
        }

        .booking-page button {
            padding: 12px 22px;
            margin: 20px 8px 0 0;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .booking-page .submit-btn {
            background: #102b55;
            color: white;
        }

        .booking-page .reset-btn {
            background: #ddd;
            color: #222;
        }
    </style>
</head>

<body>

    <div class="booking-page">

        <h1>IPL Ticket Booking Form</h1>

        <form action="#" method="get">

            <label for="name">Full Name:</label>
            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your full name"
                minlength="3"
                maxlength="40"
                required
            >

            <label for="email">Email Address:</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >

            <label for="phone">Phone Number:</label>
            <input
                type="tel"
                id="phone"
                name="phone"
                placeholder="Enter 10-digit phone number"
                pattern="[6-9][0-9]{9}"
                minlength="10"
                maxlength="10"
                title="Enter a valid 10-digit Indian mobile number"
                required
            >

            <label for="match">Select Match:</label>
            <select id="match" name="match" required>
                <option value="">-- Select a Match --</option>
                <option value="RCB vs CSK">RCB vs CSK</option>
                <option value="MI vs KKR">MI vs KKR</option>
                <option value="SRH vs DC">SRH vs DC</option>
                <option value="RR vs PBKS">RR vs PBKS</option>
            </select>

            <label for="stand">Stand Category:</label>
            <select id="stand" name="stand" required>
                <option value="">-- Select Stand --</option>
                <option value="General">General Stand</option>
                <option value="Premium">Premium Stand</option>
                <option value="VIP">VIP Stand</option>
                <option value="Corporate">Corporate Box</option>
            </select>

            <label for="tickets">Number of Tickets:</label>
            <input
                type="number"
                id="tickets"
                name="tickets"
                min="1"
                max="10"
                placeholder="Enter number of tickets"
                required
            >

            <label>Additional Preference:</label>
            <div class="preference">
                <label>
                    <input type="radio" name="preference" value="Window">
                    Window View
                </label>

                <label>
                    <input type="radio" name="preference" value="Near Ground">
                    Near Ground
                </label>
            </div>

            <button type="submit" class="submit-btn">
                Submit Booking
            </button>

            <button type="reset" class="reset-btn">
                Reset Form
            </button>

        </form>

    </div>

</body>
</html>
